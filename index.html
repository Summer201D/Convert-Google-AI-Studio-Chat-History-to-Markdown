<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google AI Studio 对话记录转 Markdown</title>

  <!-- Google 身份认证客户端库 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --border-focus: #94a3b8;
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-titles h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-titles p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }

    .auth-badge.authorized {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 24px 20px;
      text-align: center;
      background: #f8fafc;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .upload-zone svg {
      width: 32px;
      height: 32px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .upload-tip {
      font-size: 14px;
      color: var(--text);
    }

    .upload-tip strong {
      color: var(--primary);
    }

    .upload-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .channel-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .channel-divider::before,
    .channel-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .channel-divider:not(:empty)::before {
      margin-right: 12px;
    }

    .channel-divider:not(:empty)::after {
      margin-left: 12px;
    }

    .options-panel {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .options-panel label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .action-group {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn-outline-primary {
      background: #ffffff;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline-primary:hover:not(:disabled) {
      background: #eff6ff;
    }

    .status-msg {
      font-size: 13px;
      font-weight: 500;
    }

    .status-msg.success { color: var(--success); }
    .status-msg.error { color: var(--danger); }
    .status-msg.warning { color: var(--warning); }

    .preview-section {
      margin-top: 24px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .preview-header h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }

    .paste-link {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
    }

    .paste-link:hover {
      text-decoration: underline;
    }

    textarea.preview-content {
      width: 100%;
      height: 400px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      background: #ffffff;
      resize: vertical;
      outline: none;
    }

    textarea.preview-content:focus {
      border-color: var(--border-focus);
    }

    /* 云端硬盘文件选择模态弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: 10px;
      width: 580px;
      max-width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .modal-body {
      padding: 12px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .drive-file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .drive-file-item:hover {
      background-color: #f8fafc;
    }

    .drive-file-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drive-file-time {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <div class="header-titles">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Google AI Studio 对话记录转 Markdown
      </h1>
      <p>支持从云端硬盘直接读取、文件解析、代码与附件智能嵌入。</p>
    </div>

    <!-- 授权状态与控制区 -->
    <div class="auth-badge" id="authBadge">
      <span id="authStatusText">云端硬盘未授权</span>
      <button class="btn-outline-primary" id="authBtn" style="padding: 4px 10px; font-size: 12px;">登录授权</button>
    </div>
  </div>

  <!-- 云盘直连快捷通道 -->
  <div style="margin-bottom: 14px;">
    <button id="openDrivePickerBtn" class="btn-outline-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      从我的 Google 云端硬盘直接选择对话
    </button>
  </div>

  <div class="channel-divider">或通过本地文件导入</div>

  <!-- 本地文件拖拽区 -->
  <div class="upload-zone" id="uploadZone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <div class="upload-tip"><strong>点击选取文件</strong> 或拖放导出文件至此处</div>
    <div class="upload-note">支持 .json、.txt 或无扩展名的导出文件</div>
    <input type="file" id="fileInput" style="display: none;">
  </div>

  <div class="options-panel">
    <label>
      <input type="checkbox" id="optCardLayout" checked>
      卡片式对话排版
    </label>
    <label>
      <input type="checkbox" id="optCollapseThoughts" checked>
      保留思考过程（折叠展示）
    </label>
    <label>
      <input type="checkbox" id="optShowTimestamp" checked>
      包含消息时间戳
    </label>
    <label>
      <input type="checkbox" id="optExtractSystemPrompt" checked>
      解析系统提示词 (System Prompt)
    </label>
    <label>
      <input type="checkbox" id="optEmbedTextDocAsCode" checked>
      将文本附件解析为代码块置于开头
    </label>
    <label>
      <input type="checkbox" id="optAutoDownloadDrive" checked>
      自动拉取云端硬盘图片与文档
    </label>
  </div>

  <div class="action-group">
    <div class="btn-group">
      <button id="downloadBtn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        下载 Markdown 文件
      </button>
      <button id="copyBtn" class="btn-secondary" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        复制到剪贴板
      </button>
      <button id="fetchDriveBtn" class="btn-secondary" style="display: none;">
        📥 重新同步云端附件
      </button>
    </div>
    <div id="statusMessage" class="status-msg"></div>
  </div>

  <div class="preview-section">
    <div class="preview-header">
      <h2>Markdown 预览</h2>
      <span class="paste-link" id="pasteJsonTrigger">从剪贴板读取 JSON</span>
    </div>
    <textarea id="outputArea" class="preview-content" readonly placeholder="导入或在云端选择对话后，Markdown 结果将在此显示..."></textarea>
  </div>
</div>

<!-- 云端硬盘对话文件选择器弹窗 -->
<div class="modal-backdrop" id="driveModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>选择 Google AI Studio 对话</h3>
      <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" id="driveModalList">
      <div style="text-align: center; padding: 24px 0; color: var(--text-muted);">正在检索云端硬盘中的会话...</div>
    </div>
  </div>
</div>

<script>
  // Google OAuth 配置
  const GOOGLE_CLIENT_ID = '852360108690-naniu3i5sj7frv72de7jn8vq5578bd2b.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
  const STORAGE_KEY_TOKEN = 'ai_studio_md_token';
  const STORAGE_KEY_EXPIRY = 'ai_studio_md_token_expiry';

  let tokenClient = null;
  let accessToken = null;

  // 云端附件缓存，格式为 Map<fileId, { mimeType, dataUrl, textContent, name, isText } >
  const driveAttachmentCache = new Map();

  // DOM 元素引用
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const outputArea = document.getElementById('outputArea');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const fetchDriveBtn = document.getElementById('fetchDriveBtn');
  const statusMessage = document.getElementById('statusMessage');
  const pasteJsonTrigger = document.getElementById('pasteJsonTrigger');
  const authBadge = document.getElementById('authBadge');
  const authStatusText = document.getElementById('authStatusText');
  const authBtn = document.getElementById('authBtn');
  const openDrivePickerBtn = document.getElementById('openDrivePickerBtn');
  const driveModal = document.getElementById('driveModal');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const driveModalList = document.getElementById('driveModalList');

  const optCardLayout = document.getElementById('optCardLayout');
  const optCollapseThoughts = document.getElementById('optCollapseThoughts');
  const optShowTimestamp = document.getElementById('optShowTimestamp');
  const optExtractSystemPrompt = document.getElementById('optExtractSystemPrompt');
  const optEmbedTextDocAsCode = document.getElementById('optEmbedTextDocAsCode');
  const optAutoDownloadDrive = document.getElementById('optAutoDownloadDrive');

  // 内部状态
  let currentMarkdown = '';
  let documentTitle = 'chat_export';
  let parsedPayload = null;

  // 检查本地存储以恢复长期授权状态
  function restoreSavedToken() {
    const savedToken = localStorage.getItem(STORAGE_KEY_TOKEN);
    const expiry = localStorage.getItem(STORAGE_KEY_EXPIRY);

    if (savedToken && expiry && Date.now() < parseInt(expiry, 10)) {
      accessToken = savedToken;
      setAuthorizedUI(true);
    } else {
      clearSavedToken();
    }
  }

  function saveToken(token, expiresInSeconds = 3599) {
    accessToken = token;
    const expiryTime = Date.now() + expiresInSeconds * 1000;
    localStorage.setItem(STORAGE_KEY_TOKEN, token);
    localStorage.setItem(STORAGE_KEY_EXPIRY, expiryTime.toString());
    setAuthorizedUI(true);
  }

  function clearSavedToken() {
    accessToken = null;
    localStorage.removeItem(STORAGE_KEY_TOKEN);
    localStorage.removeItem(STORAGE_KEY_EXPIRY);
    setAuthorizedUI(false);
  }

  function setAuthorizedUI(isAuthorized) {
    if (isAuthorized) {
      authBadge.classList.add('authorized');
      authStatusText.textContent = 'Google 账号已授权';
      authBtn.textContent = '切换账号';
    } else {
      authBadge.classList.remove('authorized');
      authStatusText.textContent = '云端硬盘未授权';
      authBtn.textContent = '登录授权';
    }
  }

  // 初始化 Google 授权客户端
  function initGoogleClient() {
    if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: async (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            saveToken(tokenResponse.access_token, tokenResponse.expires_in || 3599);
            showStatus('Google 账号授权成功。', false);

            if (parsedPayload) {
              await pullDriveAttachments();
            }
          } else if (tokenResponse.error) {
            showStatus(`授权未完成: ${tokenResponse.error}`, true);
          }
        }
      });
    }
  }

  window.addEventListener('load', () => {
    restoreSavedToken();
    initGoogleClient();
  });

  authBtn.addEventListener('click', () => {
    if (!tokenClient) initGoogleClient();
    if (tokenClient) {
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    } else {
      showStatus('认证组件加载中，请稍后重试。', true);
    }
  });

  // 打开云端硬盘文件选择器
  openDrivePickerBtn.addEventListener('click', async () => {
    if (!accessToken) {
      if (!tokenClient) initGoogleClient();
      tokenClient.requestAccessToken({ prompt: 'consent' });
      return;
    }
    openDriveModal();
  });

  modalCloseBtn.addEventListener('click', () => {
    driveModal.style.display = 'none';
  });

  driveModal.addEventListener('click', (e) => {
    if (e.target === driveModal) driveModal.style.display = 'none';
  });

  async function openDriveModal() {
    driveModal.style.display = 'flex';
    driveModalList.innerHTML = '<div style="text-align: center; padding: 24px 0; color: var(--text-muted);">正在检索云端硬盘中的 Google AI Studio 目录...</div>';

    try {
      // 1. 定位 Google AI Studio 文件夹
      let folderId = null;
      const folderRes = await fetch("https://www.googleapis.com/drive/v3/files?q=name='Google AI Studio' and mimeType='application/vnd.google-apps.folder' and trashed=false", {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const folderData = await folderRes.json();
      if (folderData.files && folderData.files.length > 0) {
        folderId = folderData.files[0].id;
      }

      // 2. 检索对话文件
      let query = "trashed=false";
      if (folderId) {
        query += ` and '${folderId}' in parents`;
      } else {
        query += " and (mimeType='application/json' or name contains 'prompt')";
      }

      const filesRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&orderBy=modifiedTime desc&pageSize=30&fields=files(id,name,modifiedTime)`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });

      const filesData = await filesRes.json();
      if (!filesData.files || filesData.files.length === 0) {
        driveModalList.innerHTML = '<div style="text-align: center; padding: 24px 0; color: var(--text-muted);">未在云盘中找到对话文件。</div>';
        return;
      }

      driveModalList.innerHTML = '';
      filesData.files.forEach(file => {
        const item = document.createElement('div');
        item.className = 'drive-file-item';
        const dateStr = new Date(file.modifiedTime).toLocaleString();
        item.innerHTML = `
          <div class="drive-file-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>${file.name}</span>
          </div>
          <div class="drive-file-time">${dateStr}</div>
        `;
        item.onclick = () => loadFileFromDrive(file.id, file.name);
        driveModalList.appendChild(item);
      });
    } catch (err) {
      driveModalList.innerHTML = `<div style="text-align: center; padding: 24px 0; color: var(--danger);">读取失败: ${err.message}</div>`;
    }
  }

  // 直接从云端硬盘下载并解析指定会话
  async function loadFileFromDrive(fileId, fileName) {
    driveModal.style.display = 'none';
    showStatus(`正在从云端读取: ${fileName}...`, 'warning');
    documentTitle = fileName.replace(/\.(json|txt|md)$/i, '') || 'chat_export';

    try {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const text = await res.text();
      await parseAndTransform(text, `云端硬盘: ${fileName}`);
    } catch (err) {
      showStatus(`读取文件失败: ${err.message}`, true);
    }
  }

  // 拖拽与上传事件
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer && e.dataTransfer.files.length) {
      loadFromFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length) {
      loadFromFile(e.target.files[0]);
    }
  });

  [optCardLayout, optCollapseThoughts, optShowTimestamp, optExtractSystemPrompt, optEmbedTextDocAsCode].forEach(checkbox => {
    checkbox.addEventListener('change', () => {
      if (parsedPayload) {
        transformSessionToMarkdown(parsedPayload);
      }
    });
  });

  fetchDriveBtn.addEventListener('click', () => {
    pullDriveAttachments();
  });

  function loadFromFile(file) {
    documentTitle = file.name.replace(/\.(json|txt|md)$/i, '') || 'chat_export';
    const reader = new FileReader();
    reader.onload = async (e) => {
      await parseAndTransform(e.target.result, file.name);
    };
    reader.onerror = () => {
      showStatus('文件读取失败，请重试。', true);
    };
    reader.readAsText(file);
  }

  pasteJsonTrigger.addEventListener('click', async () => {
    try {
      let text = '';
      if (navigator.clipboard && window.isSecureContext) {
        text = await navigator.clipboard.readText();
      } else {
        const inputPrompt = prompt('请粘贴 Google AI Studio 导出的 JSON 文本：');
        if (inputPrompt) text = inputPrompt;
      }

      if (text && text.trim()) {
        documentTitle = 'pasted_chat';
        await parseAndTransform(text.trim(), '剪贴板内容');
      }
    } catch (err) {
      showStatus('读取剪贴板失败，请手动选择文件。', true);
    }
  });

  async function parseAndTransform(rawText, sourceDesc) {
    try {
      parsedPayload = JSON.parse(rawText.trim());
      const success = transformSessionToMarkdown(parsedPayload);
      if (success) {
        showStatus(`已解析：${sourceDesc}`, false);

        if (optAutoDownloadDrive.checked && countDriveAttachments(parsedPayload) > 0) {
          if (accessToken) {
            await pullDriveAttachments();
          } else {
            showStatus('检测到云端附件，可点击右上角登录自动同步图片与文本。', 'warning');
            fetchDriveBtn.style.display = 'inline-flex';
          }
        }
      }
    } catch (err) {
      showStatus(`JSON 解析失败: ${err.message}`, true);
    }
  }

  function showStatus(text, statusType) {
    statusMessage.textContent = text;
    if (statusType === true) {
      statusMessage.className = 'status-msg error';
    } else if (statusType === 'warning') {
      statusMessage.className = 'status-msg warning';
    } else {
      statusMessage.className = 'status-msg success';
    }
  }

  function countDriveAttachments(json) {
    const rawChunks = extractRawChunks(json);
    let count = 0;
    rawChunks.forEach(chunk => {
      if (chunk.driveImage && chunk.driveImage.id) count++;
      if (chunk.driveDocument && chunk.driveDocument.id) count++;
    });
    return count;
  }

  /**
   * 判断是否为文本/代码类文件
   */
  function isTextBasedFile(mimeType, fileName = '') {
    if (mimeType && (mimeType.startsWith('text/') || mimeType.includes('json') || mimeType.includes('javascript') || mimeType.includes('xml'))) {
      return true;
    }
    const ext = fileName.split('.').pop().toLowerCase();
    const textExts = ['txt', 'py', 'js', 'ts', 'jsx', 'tsx', 'json', 'md', 'html', 'css', 'c', 'cpp', 'java', 'go', 'rs', 'sh', 'yaml', 'yml', 'csv'];
    return textExts.includes(ext);
  }

  /**
   * 拉取云端文件并智能分类处理（图片转 DataURL，文本提取全文）
   */
  async function fetchDriveMedia(fileId) {
    if (driveAttachmentCache.has(fileId)) {
      return driveAttachmentCache.get(fileId);
    }

    try {
      let mimeType = 'application/octet-stream';
      let fileName = 'file';
      try {
        const metaRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=name,mimeType`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (metaRes.ok) {
          const metaJson = await metaRes.json();
          if (metaJson.mimeType) mimeType = metaJson.mimeType;
          if (metaJson.name) fileName = metaJson.name;
        }
      } catch (e) {}

      const mediaRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });

      if (!mediaRes.ok) throw new Error(`HTTP ${mediaRes.status}`);

      const blob = await mediaRes.blob();
      const isText = isTextBasedFile(mimeType, fileName);

      let textContent = null;
      let dataUrl = null;

      if (isText) {
        textContent = await blob.text();
      } else {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      const result = { mimeType, dataUrl, textContent, fileName, isText };
      driveAttachmentCache.set(fileId, result);
      return result;
    } catch (err) {
      console.warn(`拉取附件 ${fileId} 失败:`, err);
      return null;
    }
  }

  async function pullDriveAttachments() {
    if (!accessToken) {
      authBtn.click();
      return;
    }

    const rawChunks = extractRawChunks(parsedPayload);
    const fileIds = new Set();
    rawChunks.forEach(chunk => {
      if (chunk.driveImage && chunk.driveImage.id) fileIds.add(chunk.driveImage.id);
      if (chunk.driveDocument && chunk.driveDocument.id) fileIds.add(chunk.driveDocument.id);
    });

    if (fileIds.size === 0) return;

    const total = fileIds.size;
    let completed = 0;
    showStatus(`正在下载云端附件 (0/${total})...`, 'warning');

    for (const id of fileIds) {
      await fetchDriveMedia(id);
      completed++;
      showStatus(`正在下载云端附件 (${completed}/${total})...`, 'warning');
    }

    showStatus(`附件同步完成，已处理 ${completed} 个文件。`, false);
    fetchDriveBtn.style.display = 'none';

    transformSessionToMarkdown(parsedPayload);
  }

  function extractRawChunks(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    if (data.chunkedPrompt && Array.isArray(data.chunkedPrompt.chunks)) return data.chunkedPrompt.chunks;
    if (data.prompt && Array.isArray(data.prompt.chunks)) return data.prompt.chunks;
    if (Array.isArray(data.contents)) return data.contents;
    if (data.prompt && Array.isArray(data.prompt.contents)) return data.prompt.contents;
    return [];
  }

  function extractSystemInstruction(data) {
    const rawInstruction = data.systemInstruction || 
      (data.chunkedPrompt && data.chunkedPrompt.systemInstruction) ||
      (data.prompt && data.prompt.systemInstruction);

    if (!rawInstruction) return '';
    if (typeof rawInstruction === 'string') return rawInstruction.trim();
    if (Array.isArray(rawInstruction.parts)) {
      return rawInstruction.parts.map(p => p.text || '').join('\n').trim();
    }
    return '';
  }

  function mergeConsecutiveMessages(chunks) {
    const merged = [];

    chunks.forEach(chunk => {
      let role = 'assistant';
      if (chunk.role === 'user') role = 'user';
      else if (chunk.role === 'system') role = 'system';
      else if (chunk.role === 'model' || chunk.role === 'assistant') role = 'assistant';

      let textContent = '';
      let thoughtContent = '';
      const attachments = [];

      if (Array.isArray(chunk.parts) && chunk.parts.length > 0) {
        chunk.parts.forEach(part => {
          if (part.thought && part.text) {
            thoughtContent += part.text;
          } else if (part.text) {
            textContent += part.text;
          }

          const inline = part.inlineData || part.inline_data;
          if (inline && inline.mimeType) {
            attachments.push({
              type: 'inline',
              mimeType: inline.mimeType,
              data: inline.data
            });
          }
        });
      } else if (typeof chunk.text === 'string') {
        textContent = chunk.text;
      }

      textContent = textContent.replace(/thoughtSignature:\s*"[A-Za-z0-9+/=]+"/g, '').trim();

      if (chunk.driveImage && chunk.driveImage.id) {
        attachments.push({ type: 'driveImage', id: chunk.driveImage.id });
      }
      if (chunk.driveDocument && chunk.driveDocument.id) {
        attachments.push({ type: 'driveDoc', id: chunk.driveDocument.id });
      }

      const last = merged[merged.length - 1];

      if (last && last.role === role) {
        if (textContent) last.texts.push(textContent);
        if (thoughtContent) last.thoughts.push(thoughtContent);
        if (attachments.length) last.attachments.push(...attachments);
      } else {
        merged.push({
          role,
          createTime: chunk.createTime || chunk.timestamp || null,
          texts: textContent ? [textContent] : [],
          thoughts: thoughtContent ? [thoughtContent] : [],
          attachments
        });
      }
    });

    return merged;
  }

  function transformSessionToMarkdown(json) {
    const rawChunks = extractRawChunks(json);
    if (!rawChunks.length) {
      showStatus('未在该数据中检测到有效的对话切片。', true);
      return false;
    }

    const messages = mergeConsecutiveMessages(rawChunks);
    const useCardLayout = optCardLayout.checked;
    const collapseThoughts = optCollapseThoughts.checked;
    const showTimestamp = optShowTimestamp.checked;
    const extractSysPrompt = optExtractSystemPrompt.checked;
    const embedTextAsCode = optEmbedTextDocAsCode.checked;

    let md = `# 对话记录: ${documentTitle}\n\n`;

    const model = json.runSettings?.model || json.model;
    if (model) {
      md += `> **模型**: \`${model}\`  \n`;
    }
    md += `> **对话轮次**: ${messages.length} 轮  \n\n`;

    if (extractSysPrompt) {
      const systemInstruction = extractSystemInstruction(json);
      if (systemInstruction) {
        md += `<details>\n<summary><b>系统提示词 (System Instruction)</b></summary>\n\n`;
        md += `> ` + systemInstruction.replace(/\n/g, '\n> ') + `\n\n`;
        md += `</details>\n\n`;
      }
    }

    md += `---\n\n`;

    messages.forEach(msg => {
      let roleTitle = 'AI';
      if (msg.role === 'user') roleTitle = 'User';
      else if (msg.role === 'system') roleTitle = 'System';
      else roleTitle = 'Assistant';

      let timeBadge = '';
      if (showTimestamp && msg.createTime) {
        const timeStr = new Date(msg.createTime).toLocaleString();
        timeBadge = ` <span style="font-size:12px;color:#64748b;font-weight:normal;">(${timeStr})</span>`;
      }

      // 1. 处理附件（置于消息开头）
      let topAttachmentsMd = '';
      let nonTextAttachmentsMd = '';

      if (msg.attachments.length > 0) {
        msg.attachments.forEach(att => {
          if (att.type === 'driveImage' || att.type === 'driveDoc') {
            if (driveAttachmentCache.has(att.id)) {
              const cached = driveAttachmentCache.get(att.id);

              if (cached.isText && embedTextAsCode) {
                // 文本类附件以代码格式嵌入开头
                const ext = (cached.fileName || '').split('.').pop() || 'txt';
                topAttachmentsMd += `**📄 上传文档 (${cached.fileName || 'document'})**:\n\n\`\`\`${ext}\n${cached.textContent}\n\`\`\`\n\n`;
              } else if (cached.mimeType && cached.mimeType.startsWith('image/')) {
                nonTextAttachmentsMd += `![${cached.fileName || '云端图片'}](${cached.dataUrl})\n\n`;
              } else if (cached.mimeType && cached.mimeType.startsWith('audio/')) {
                nonTextAttachmentsMd += `<audio controls src="${cached.dataUrl}"></audio>\n\n`;
              } else {
                nonTextAttachmentsMd += `<span style="display:inline-block;padding:2px 8px;background:#e2e8f0;border-radius:4px;font-size:12px;margin-bottom:6px;">📄 ${cached.fileName || '文档附件'}</span>\n\n`;
              }
            } else {
              const isImg = att.type === 'driveImage';
              const label = isImg ? '图片附件' : '文档附件';
              nonTextAttachmentsMd += `<a href="https://drive.google.com/file/d/${att.id}/view" target="_blank" style="text-decoration:none;display:inline-block;margin-bottom:6px;">\n` +
                `  <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;color:#2563eb;">\n` +
                `    📁 ${label} (ID: <code>${att.id.slice(0, 8)}...</code> ↗)\n` +
                `  </span>\n` +
                `</a>\n\n`;
            }
          } else if (att.type === 'inline') {
            if (att.mimeType.startsWith('image/')) {
              nonTextAttachmentsMd += `![附件图片](data:${att.mimeType};base64,${att.data})\n\n`;
            } else if (att.mimeType.startsWith('audio/')) {
              nonTextAttachmentsMd += `<audio controls src="data:${att.mimeType};base64,${att.data}"></audio>\n\n`;
            } else {
              nonTextAttachmentsMd += `<span style="display:inline-block;padding:2px 8px;background:#e2e8f0;border-radius:4px;font-size:12px;margin-bottom:6px;">文件附件 (类型: <code>${att.mimeType}</code>)</span>\n\n`;
            }
          }
        });
      }

      // 2. 组装思考链
      let thoughtSection = '';
      if (collapseThoughts && msg.thoughts.length > 0) {
        const combinedThoughts = msg.thoughts.join('\n\n').trim();
        if (combinedThoughts) {
          thoughtSection = `<details style="margin-bottom:12px;padding:8px 12px;background:#f8fafc;border-radius:6px;border:1px dashed #cbd5e1;">\n` +
            `<summary style="cursor:pointer;color:#64748b;font-size:13px;"><b>思考过程 (Thinking Process)</b></summary>\n\n> ` +
            combinedThoughts.replace(/\n/g, '\n> ') +
            `\n\n</details>\n\n`;
        }
      }

      // 3. 组装正文
      const bodySection = msg.texts.join('\n\n').trim();

      // 4. 根据排版格式组装各模块
      if (useCardLayout) {
        const isUser = msg.role === 'user';
        const cardStyle = isUser
          ? 'background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px 20px;margin:14px 0 14px 4%;'
          : 'background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;margin:14px 4% 14px 0;box-shadow:0 1px 2px rgba(0,0,0,0.03);';

        md += `<div style="${cardStyle}">\n\n`;
        md += `<div style="margin-bottom:8px;font-size:14px;"><b>${roleTitle}</b>${timeBadge}</div>\n\n`;
        if (topAttachmentsMd) md += `${topAttachmentsMd}\n\n`;
        if (nonTextAttachmentsMd) md += `${nonTextAttachmentsMd}\n\n`;
        if (thoughtSection) md += `${thoughtSection}\n\n`;
        if (bodySection) md += `${bodySection}\n\n`;
        md += `</div>\n\n`;
      } else {
        md += `### ${roleTitle}${timeBadge}\n\n`;
        if (topAttachmentsMd) md += `${topAttachmentsMd}\n\n`;
        if (nonTextAttachmentsMd) md += `${nonTextAttachmentsMd}\n\n`;
        if (thoughtSection) md += `${thoughtSection}\n\n`;
        if (bodySection) md += `${bodySection}\n\n`;
        md += `---\n\n`;
      }
    });

    currentMarkdown = md;
    outputArea.value = currentMarkdown;
    downloadBtn.disabled = false;
    copyBtn.disabled = false;
    return true;
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {}
    }

    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    let success = false;
    try {
      success = document.execCommand('copy');
    } catch (err) {
      success = false;
    }
    document.body.removeChild(textarea);
    return success;
  }

  downloadBtn.addEventListener('click', () => {
    if (!currentMarkdown) return;
    const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = `${documentTitle}.md`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(blobUrl);
  });

  copyBtn.addEventListener('click', async () => {
    if (!currentMarkdown) return;
    const originalText = copyBtn.innerHTML;
    const success = await copyText(currentMarkdown);

    if (success) {
      copyBtn.textContent = '已复制到剪贴板';
      setTimeout(() => {
        copyBtn.innerHTML = originalText;
      }, 1500);
    } else {
      showStatus('复制失败，请手动在下方文本框全选复制。', true);
    }
  });
</script>
